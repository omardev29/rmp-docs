# What the reference shows, and where. Everything else about it -- every
# signature, sentence and line number -- comes from include/rmp/*.h.
#
# Every entry below says why. An entry that no longer matches anything in the
# headers fails the build: a decision about a name that is gone is not kept.

# Internal declarations that ARE the API a game sees, under another name.
[expose."rmp::detail::Resource"]
title = "Resource handles"
reason = "rmp::Texture, rmp::Sound and the other handles are aliases of it; its members are what a game calls on them"

# Public declarations the reference does not show.
[hide]

# Public declarations allowed to have no comment, for now. Each one is debt;
# phase 13 is not finished until this table is empty.
[allow_undocumented]

# Macros a game can read that no header defines: the build system passes them
# on the compiler's command line. Each names the files that set it, and the
# build fails when one of them stops: a define the page promises and no build
# passes would be read as 0 by every `#if`.
[build_defines.RMP_PRODUCTION_BUILD]
set_in = ["CMakeLists.txt", "raymob/app/src/main/cpp/CMakeLists.txt", "ios/project.yml"]
doc = "1 in a release build and 0 in a debug one, on every platform: `rmp build release`, `rmp web` and every build CI ships are 1; `rmp build` and `rmp run` are 0. A build system that forgets it is a compile error in `src/rmp/app.cpp`, not a quiet debug build, so `#if RMP_PRODUCTION_BUILD` is safe to write."
[build_defines.RMP_RESOURCES_PATH]
set_in = ["CMakeLists.txt"]
doc = "The folder loose resources are read from, ending in a slash. A game does not need it: `rmp::assets` resolves a name against the pack first and this folder second, and so does plain raylib's `LoadTexture()` on a path inside it."

# Keys of the .toml whose comment in the framework's own .toml describes what the
# framework at FRAMEWORK_REF does not do. The configuration reference shows
# `comment` in its place, and only while the framework's comment still starts
# with `replaces`: when that comment changes the build fails, and whoever bumps
# FRAMEWORK_REF reads the new one and drops the entry once it is true.
[config_comment."android.gradle_offline"]
replaces = "Where CI's Android job gets Gradle and the libraries the app builds with."
comment = """
Written into raymob/generated.properties as `gradle.offline`, and refused
unless it is `true` or `false`. Nothing reads it at the commit this site
documents: CI's Android job downloads Gradle and the libraries the app builds
with, and caches them between runs, whichever it says, and `rmp android`
does the same.
"""
reason = "The framework's comment describes an Android job that runs Gradle with --offline from the build image. At FRAMEWORK_REF no workflow reads gradle.offline, and _android.yml runs ./gradlew without --offline."
