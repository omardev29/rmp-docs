# The site's own settings. Everything a page could get wrong by typing it is
# NOT here: counts, lists and tables come from the framework at FRAMEWORK_REF.

[site]
title = "raylib_multiplatform"
framework_repo = "https://github.com/omardev29/raylib_multiplatform"
docs_repo = "https://github.com/omardev29/rmp-docs"
base_url = "https://omardev29.github.io/rmp-docs/"

# The tabs across the top, in order. Each is a folder of content/ with an
# index.html; reference/ is generated from the headers.
[[sections]]
id = "getting-started"
title = "Getting started"

[[sections]]
id = "manual"
title = "Manual"

[[sections]]
id = "examples"
title = "Examples"

[[sections]]
id = "publishing"
title = "Publishing"

[[sections]]
id = "framework"
title = "Framework"

[[sections]]
id = "guidelines"
title = "Guidelines"

[[sections]]
id = "reference"
title = "Reference"

[served]
# Files of the framework the site serves at its root, as they are at
# FRAMEWORK_REF: the one-liners on the install page fetch these two. The
# `installer` gate holds every byte, and the line endings, to the framework's.
"install.sh" = "tools/install.sh"
"install.ps1" = "tools/install.ps1"

[budgets]
page_kb = 400       # one built page, HTML only
css_kb = 80         # every stylesheet together, before it is concatenated
js_kb = 40          # every script together
search_gz_kb = 200  # assets/search.json gzipped: what a reader downloads when search first opens
search_kb = 1500    # the same file as the browser parses it

[links]
# Where a link may leave the site to. A prefix, https only.
allow = [
  "https://github.com/omardev29/",
  "https://www.raylib.com/",
  "https://github.com/raysan5/",
  "https://github.com/nicbarker/clay",
  "https://www.python.org/downloads/",
  "https://cmake.org/",
  "https://ldtk.io",
  "https://www.mapeditor.org/",
  "https://www.aseprite.org/",
  "https://emscripten.org/",
  "https://developer.android.com/",
  "https://developer.apple.com/",
  "https://itch.io/",
  "https://firebase.google.com/",
  "https://docs.github.com/",
  "https://openfontlicense.org/",
  "https://en.cppreference.com/",
  "https://google.github.io/styleguide/",
  "https://clang.llvm.org/extra/clang-tidy/",
]

[counted]
# Nouns whose count is the framework's, not the page's: a typed number next to
# one of these is the `counts` gate's business. "14 targets" stayed in this
# project's own design document for a phase after it became 17.
nouns = ["targets", "target", "platforms", "behaviors", "behaviours", "examples", "games",
         "headers", "modules", "families"]

[forbidden]
# Phrases a page may never contain. The framework stopped being a template,
# and the Justfile is gone.
phrases = ["this template", "just run", "just test", "just build", "Justfile"]
